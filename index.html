<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="color-scheme" content="light dark"/>
    <meta name="theme-color" content="#ffffff"/>
    <script>
      (() => {
        let preference = 'system';
        try { const stored = localStorage.getItem('frame:appearance'); if (stored === 'light' || stored === 'dark') preference = stored; } catch {}
        const theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <meta name="description" content="Frame — редактор обучающих видео на React и Remotion."/>
    <title>Frame — редактор видео</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
